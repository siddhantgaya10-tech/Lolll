};

const state = { chapter: "ch1", view: "notes", query: "" };
const $ = (sel) => document.querySelector(sel);

function matches(text) {
  return !state.query || text.toLowerCase().includes(state.query);
}

function stripTags(html) {
  const d = document.createElement("div");
  d.innerHTML = html;
  return d.textContent || "";
}

function renderNotes(ch) {
  let html = "";
  ch.notes.forEach(sec => {
    const items = sec.items.filter(i => matches(stripTags(i) + " " + sec.h));
    if (!items.length) return;
    const tag = sec.ordered ? "ol" : "ul";
    html += `<section class="card"><h2>${sec.h}</h2><${tag}>${items.map(i => `<li>${i}</li>`).join("")}</${tag}></section>`;
  });
  const pts = ch.points.filter(p => matches(p));
  if (pts.length) {
    html += `<section class="card points"><h2>Points to remember</h2><ul>${pts.map(p => `<li>${p}</li>`).join("")}</ul></section>`;
  }
  return html;
}

function renderQA(ch) {
  const list = ch.qa.filter(x => matches(x.q + " " + x.a));
  if (!list.length) return `<p class="empty">No questions match your search.</p>`;
  return list.map(x => `
    <details>
      <summary>${x.q}</summary>
      <div class="answer"><p>${x.a}</p></div>
    </details>`).join("");
}

function renderExercises(ch) {
  let html = "";
  ch.exercises.forEach(sec => {
    const items = sec.items.filter(i => matches(i.q + " " + i.a + " " + sec.h));
    if (!items.length) return;
    html += `<section class="card"><h2>${sec.h}</h2>`;
    items.forEach(i => {
      html += `<p class="ex-q">${i.q}</p><div class="ans">${i.a}</div>`;
    });
    html += `</section>`;
  });
  return html || `<p class="empty">No exercises match your search.</p>`;
}

function render() {
  const ch = DATA[state.chapter];
  $("#chapter-title").textContent = ch.title;
  $("#chapter-pages").textContent = ch.pages;
  let body = "";
  if (state.view === "notes") body = renderNotes(ch) || `<p class="empty">No notes match your search.</p>`;
  if (state.view === "qa") body = renderQA(ch);
  if (state.view === "exercises") body = renderExercises(ch);
  $("#view").innerHTML = body;
}

document.querySelectorAll("[data-chapter]").forEach(btn => {
  btn.addEventListener("click", () => {
    state.chapter = btn.dataset.chapter;
    document.querySelectorAll("[data-chapter]").forEach(b => b.setAttribute("aria-selected", b === btn));
    render();
  });
});

document.querySelectorAll("[data-view]").forEach(btn => {
  btn.addEventListener("click", () => {
    state.view = btn.dataset.view;
    document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b === btn));
    render();
  });
});

$("#filter").addEventListener("input", e => {
  state.query = e.target.value.trim().toLowerCase();
  render();
});

render();
</script>
</body>
</html>
